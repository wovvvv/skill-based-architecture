# Self-hosting conformance manifest — content-presence guard for THIS repo.
#
# This repo is self-hosting: formal docs live at the root (SKILL.md,
# WORKFLOW.md, TEMPLATES-GUIDE.md, references/*) instead of under
# skills/<name>/workflows/. The downstream-facing manifest lives at
# `templates/skill/conformance.yaml` and assumes the standard layout, so it
# cannot validate this repo's own canonical content.
#
# This file fills that gap: assert that the upstream still teaches the
# protocols, gates, and principles its own templates promise. If a refactor
# accidentally drops "Task Closure Protocol" from TEMPLATES-GUIDE.md or
# "Progressive Rigor" from SKILL.md, the next `scripts/check-all.sh` run fails.
#
# Validate with:
#   bash templates/skill/scripts/check-version-conformance.sh . \
#     --conformance references/self-hosting-conformance.yaml
#
# Bumping rule: when you add a new mandatory protocol/principle phrase to
# `templates/skill/conformance.yaml`, mirror it here against whichever
# self-hosting file teaches the same thing. Otherwise upstream can quietly
# stop teaching what the templates require downstream to carry.

required_sections:
  # SKILL.md teaches the activation contract — every principle below has a
  # downstream counterpart that propagates via templates/skill/SKILL.md.template.
  - file: SKILL.md
    must_contain:
      - "## Progressive Rigor"
      - "Routing.yaml as source"
      - "Activation over storage"
      - "every loaded file needs an independent task-time reason"
      - "Self-maintenance"
      - "Token efficiency"
      - "Task Execution + Closure"
      - "present it proportionally"
      - "Anchor Checkpoint"

  # TEMPLATES-GUIDE.md after the 2026-05-09 slim only carries Minimal Starter,
  # Classification Guide, Sync Targets, and pointers to canonical workflow
  # templates. The protocol-level assertions previously held here moved to
  # references/protocols.md (concepts) and templates/skill/workflows/update-rules.md
  # (the workflow text itself, validated by templates/skill/conformance.yaml).
  # We still assert TEMPLATES-GUIDE.md keeps its core scaffolding role.
  - file: TEMPLATES-GUIDE.md
    must_contain:
      - "## Minimal Starter Template"
      - "## Classification Guide"
      - "## Sync Targets"
      - "## Task Execution Protocol"
      - "## Task Closure Protocol"
      - "task-execution.md"
      - "Anchor Checkpoint"
      - "plan-large.md"
      - "subagent-auxiliary.md"
      - "subagent-driven.md"
      - "subagent-orchestration.md"
      - "Task Ref/Role dispatch"
      - "vendor/project-owned/generated/runtime-data owners"

  - file: docs/sba-bible.md
    must_contain:
      - "## 产品边界"
      - "SBA 就是一个 Skill，不是 Agent 操作系统"
      - "使用所在 harness 已有的 Plan、Subagent 和工具能力"
      - "不自建常驻服务、任务数据库、统一状态机或独立调度 runtime"
      - "## 最高纲领"
      - "## 要证明的三件事"
      - "看到更完整的信息"
      - "在没有标准答案时做判断"
      - "让别人按照你的意愿做事情"
      - "## 真正的不可替代"
      - "定义标准、判断风险、协调资源、带出结果"
      - "新机制必须减少责任或解决真实失败，不能只是让架构显得完整"
      - "默认核心应该更小但完整"
      - "规则必须能被正确激活；仅仅存进仓库不算产生价值"
      - "Agent 的结论必须可复核"
      - "语义完整性优先于代码改动最少，但验证成本必须与风险匹配"
      - "验证前必须把风险、验证证据和停止条件绑定起来"
      - "不得用测试数量代替证据质量"
      - "跨 harness 兼容应当优雅降级"
      - "SBA 负责吸收工程复杂度"
      - "不发展成 Agent 操作系统、任务数据库或项目管理平台"
      - "不为了“以后也许有用”持续增加文件、状态、marker、脚本和术语"
      - "不用结构检查的绿色结果冒充语义正确"
      - "不因为外部项目设计漂亮就直接吸收"
      - "新证据推翻承重结论时，不得静默覆盖"
      - "涉及规范性业务判断时，由业务 owner 确认"
      - "代码可以暴露约束、成本和风险，但无权替用户修改已经确认的业务主线"
      - "发现偏移必须立即停下来协商"
      - "触发条件、立即动作、当前任务的验收责任可以适度重复"
      - "完整定义、状态转换和多步骤流程原则上只维护一次"
      - "完整重复比跳转、加载或生成更便宜"
      - "不得机械地“一律抽取”"
      - "## 方向决策检查"
      - "它不进入下游模板"

  # WORKFLOW.md after the 2026-05-09 split is the Quick Start entry; the full
  # 9-phase content (including Phase 9 pressure-test) moved to
  # workflows/full-migration.md. Assert WORKFLOW.md still routes to the new
  # locations and full-migration carries the protocol anchors.
  - file: WORKFLOW.md
    must_contain:
      - "Quick Start"
      - "workflows/full-migration.md"
      - "workflows/upgrade-downstream.md"
      - "scripts/scaffold-downstream.sh"
      - "never overwrites existing project entry files"
      - "source-to-destination evidence"
      - "does **not** prove that pre-existing user instructions survived"
      - "task-execution.md#user-decision-drift-gate"

  - file: references/thin-shells.md
    must_contain:
      - "Request-clarity judgment"
      - "vague wording is a signal, not an automatic blocker"
      - "bounded read-only project evidence"
      - "Do not mutate before the outcome is verifiable"

  - file: workflows/full-migration.md
    must_contain:
      - "Phase 9"
      - "Task Execution Protocol"
      - "Task Closure Protocol"
      - "After-Action Review"

  # protocols.md is the cross-skill reference for execution + closure. It must
  # carry the same canonical headings the templates require downstream.
  - file: references/protocols.md
    must_contain:
      - "## Task Execution Protocol"
      - "Workflow owns the reusable domain procedure"
      - "not a fixed chat template"
      - "visible native Plan for step display"
      - "Anchor Checkpoint"
      - "does not duplicate the gate's trigger, state transition, evidence, or resume procedure"
      - "## Task Closure Protocol"
      - "## Recording Threshold"
      - "## Generalization Rule"
      - "fidelity"
      - "reconciliation"
      - "cross-implementation stability"
      - "bind material risk to fitted evidence and a stop/escalation condition"
      - "user-confirmed"
      - "Plan implementation handoff"
      - "current implementation fact"

  - file: references/business-global-model.md
    must_contain:
      - "## Orthogonal task and domain routing"
      - "domain_overlays"
      - "task_route_id"
      - "## Cross-owner reads"
      - "owner_roots"
      - "owner:<owner-id>:<path>"
      - "target existence as unverified"
      - "## Provenance and retirement"
      - "not a permanent double-maintenance protocol"
      - "## Desired truth and implementation fact"
      - "canonical information-model definition"
      - "## Confirmed implementation gap intake"
      - "Standalone modeling defaults to the routed business model, not a PRD"
      - "all four conditions hold"
      - "Never create one PRD per gap"
      - "The first gap does not interrupt the modeling task"
      - "Do not ask code and the confirmed model to compete for authority"
      - "User Decision Drift Gate"
      - "task-execution.md#user-decision-drift-gate"

  - file: templates/skill/rules/agent-behavior.md
    must_contain:
      - "### Implementation-Fact Question Gate"
      - "close the smallest decision-relevant implementation path"
      - "Trace distinct flows independently"
      - "remaining normative ambiguity"

  - file: templates/skill/workflows/plan-feature.md
    must_contain:
      - "## Modeling Gap Intake Handoff"
      - "### Plan-Complete Brainstorm Handoff"
      - "automatically enter a detailed user-facing brainstorm"
      - "exactly one topic"
      - "three-line summary"

  - file: templates/skill/workflows/profile-business-model.md.example
    must_contain:
      - "does not create a PRD merely because the scope is long or complex"
      - "Reconcile leaf / Gotcha ownership"
      - "Implementation-Fact Question Gate"
      - "## Confirmed Implementation Gap Collection and Handoff"
      - "Continue the user's agreed modeling scope"

  - file: templates/skill/workflows/fix-bug.md
    must_contain:
      - "Implementation-Fact Question Gate"
      - "Never ask the user to choose a current implementation fact"
      - "If the user says the answer is in code"

  - file: templates/skill/workflows/update-rules.md
    must_contain:
      - "## Business Leaf and Gotcha Ownership"
      - "Never copy the complete definition into both destinations"
      - "## Standalone Business-Model Input"
      - "Do not require a feature Plan"
      - "create or reuse one draft gap dossier"

  - file: docs/plans/README.md
    must_contain:
      - "active decision records"
      - "authority for its user-confirmed brainstorm and implementation mainline"
      - "initialize `distilled_to:` with actual targets"
      - "Purely technical Plans create no business leaf"
      - "One active destination owns the complete definition"
    must_not_contain:
      - "it goes in both places"

  - file: templates/skill/workflows/maintain-docs.md
    must_contain:
      - "## Semantic Ownership and Local Actionability"
      - "business-truth owner inversion"
      - "one complete semantic owner"
      - "smallest task-specific trigger, immediate action, and current-task acceptance responsibility"
      - "A complete repeated rule or workflow is exceptional"
      - "independently delivered or independently used"

  - file: REFERENCE.md
    must_contain:
      - "Decision capture/handoff"
      - "desired truth vs implementation fact"
      - "implementation drift"
      - "Consumers keep only their immediate action and acceptance hook"

# Files required to exist (presence-only check). Drift here means a
# self-hosting structural piece was deleted without updating routing.
required_files:
  - path: README.md
  - path: REFERENCE.md
  - path: EXAMPLES.md
  - path: workflows/upgrade-downstream.md
  - path: references/self-hosting-routing.yaml
  - path: references/business-global-model.md
  - path: references/permission-model.md
  - path: references/tests-as-spec.md
  - path: templates/skill/conformance.yaml
  - path: templates/skill/scripts/check-version-conformance.sh
  - path: templates/skill/workflows/task-execution.md
  - path: docs/task-anchor-native-plan.md
  - path: docs/sba-bible.md
