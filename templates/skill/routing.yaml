# Canonical Routing Manifest
#
# Sole source of exact task-route data plus optional Always Read entries and
# shell bootstraps. Domain selection is a later evidence-gated phase owned
# by domain-routing.yaml when the first real domain is admitted.
# Edit this file first, then run `bash scripts/sync-routing.sh`.
# Downstream from repo root: `bash skills/<name>/scripts/sync-routing.sh <name>`.
# Do not hand-edit generated Always Read lists, the Common Tasks action hook, bootstrap blocks,
# or shell behavior blocks (auto-triggers + red flags). Edit the behavior block in
# scripts/sync-routing.sh, then re-run sync.

# Default empty. Add an entry only when every task demonstrably needs it before
# its workflow can start; domain, mutation, testing, and closure knowledge do
# not qualify because their workflows activate them later.
always_read: []

# FILL: Replace scaffold rows with this project's real 3-8 recurring task types;
# keep an "other" fallback. A task row selects only the first workflow; it must
# not carry required_reads or inline domain overlays. The workflow gathers the
# smallest evidence and pulls knowledge only when an unresolved decision needs it.
# Two-root skills may prefix workflow with `skill:`/`code:` and add path_resolution.
tasks:
  - id: fix-bug
    labels: { en: Fix bug, zh: 修复 bug / 排查异常 }
    workflow: workflows/fix-bug.md
    trigger_examples:
      - 这个接口报错了
      - 测试挂了
      - fix this failing test
  - id: change-managed
    labels: { en: Add / refactor / optimize non-bug behavior, zh: 新增 / 重构 / 优化非 bug 行为 }
    workflow: workflows/change-managed.md
    trigger_examples:
      - 优化这个模块
      - 帮我加一个功能
      - refactor this flow
  - id: refactor-fanout
    labels: { en: Refactor across many usage points (rename / change signature / migrate), zh: 跨多处的同型重构(改名 / 改签名 / 迁移) }
    workflow: workflows/refactor-fanout.md
    trigger_examples:
      - 把这个函数改名,所有地方都跟着改
      - rename X across the codebase
      - extract this interface, update all implementers
      - 这个 API 签名改了,所有 caller 也改一下
  - id: define-requirement
    labels: { en: Define or clarify desired behavior, zh: 定义 / 澄清需求与目标行为 }
    workflow: workflows/define-requirement.md
    trigger_examples:
      - 先讨论需求,不要写 Plan 或代码
      - 先帮我把这个需求问清楚
      - brainstorm the desired behavior before planning
  - id: plan-feature
    labels: { en: Plan implementation for a confirmed requirement, zh: 基于已确认需求制定实现计划 }
    workflow: workflows/plan-feature.md
    trigger_examples:
      - 需求已经确认,制定实现 Plan
      - 基于这个需求规划怎么改代码
      - plan the implementation for this confirmed requirement
  - id: profile-project
    labels: { en: Profile / refresh project understanding, zh: 梳理 / 刷新项目理解 }
    workflow: workflows/profile-project.md
    trigger_examples:
      - 帮我理解这个项目
      - 重新梳理项目规则
      - refresh the project profile
  - id: update-upstream
    labels: { en: Update from skill-based-architecture upstream, zh: 从上游 skill-based-architecture 更新 }
    workflow: workflows/update-upstream.md
    trigger_examples:
      - 上游项目更新了,帮我更新一下
      - 更新 skill-based-architecture 模板
      - refresh from upstream
  - id: update-rules
    labels: { en: Update skill rules or record lessons, zh: 更新 skill 规则 / 记录经验 }
    workflow: workflows/update-rules.md
    trigger_examples:
      - 记录这个规则
      - 把这次踩坑记下来
      - update the project skill rules
  - id: receiving-review
    labels: { en: Act on code review feedback, zh: 处理代码评审意见 }
    workflow: workflows/receiving-review.md
    trigger_examples:
      - 帮我看看这些评审意见
      - reviewer 提了几个问题,处理一下
      - address this PR review feedback
      - 改一下 code review 提的点
  - id: other
    labels: { en: Other / unlisted task, zh: 其他 / 未列出的任务 }
    workflow: workflows/task-execution.md
    trigger_examples:
      - 其他没有明确路由的任务
