# Downstream behavior contract for the reusable scaffold.
# Validated by scripts/check-version-conformance.sh. Keep only load-bearing
# behavior anchors here; routing, generated blocks, links, and budgets have
# their own checks.

required_sections:
  - file: routing.yaml
    must_contain:
      - "id: receiving-review"
      - "workflow: workflows/receiving-review.md"
      - "reviewer 提了几个问题,处理一下"

  - file: protocol-blocks/ambiguous-request-gate.md
    must_contain:
      - "Vague wording is a signal, not an automatic blocker"
      - "smallest read-only evidence set"
      - "normative product or business preference"
      - "Do not mutate until the requested outcome is concrete enough to verify"
      - "User-as-index"
    must_not_contain:
      - "Let me scan the project first, then ask"
      - "**Stop.**"

  - file: workflows/task-execution.md
    must_contain:
      - "## Task Classifier"
      - "## Task Anchor"
      - "## Workflow Boundary"
      - "## Recitation Loop"
      - "## Execution Loop"
      - "## New Message Gate"
      - "## Exit To Closure"
      - "Simple tasks skip this protocol"
      - "After any needed alignment, proceed without waiting unless"
      - "harness's native Plan/Task surface"
      - "runtime state, not a fixed chat template"
      - "natural-language alignment"
      - "do not repeat its steps in chat"
      - "## Presentation Gate"
      - "Evaluate **Structured Brief first**"
      - "Compact Alignment is allowed only when all Structured conditions are false"
      - "first user-facing task-start message MUST begin with separate Goal"
      - "Steps must be numbered"
      - "do not collapse the brief into prose"
      - "Before each main Plan step"
      - "Never silently overwrite a load-bearing conclusion"
      - "business owner's confirmation"
      - "source Plan path"
      - "only business-bearing decisions require a routed business rule"
      - "## User Decision Drift Gate"
      - "canonical owner of the gate's trigger"
      - "Code may expose constraints, cost, and risk"
      - "Pause the affected implementation path immediately"
      - "Independent work may continue only when it cannot prejudge the decision"
      - "Mark every alternative `proposed`"
      - "mark the prior decision `superseded`"
      - "do not wait for review or Closure"
      - "bind the material risk, fitted evidence, and stop/escalation condition"
      - "do not narrate it before every tool call"
      - "does not create durable planning files or recover task state across Sessions"
    must_not_contain:
      - "task_plan.md"
      - "cross-tool state sync"
      - "Plan: <concise task-specific steps"

  - file: workflows/plan-feature.md
    must_contain:
      - "## Complexity Gate"
      - "## Question Gate"
      - "Implementation facts closed?"
      - "trace distinct flows independently"
      - "do not combine two incomplete flows into a binary choice"
      - "never ask the user to restate an implementation fact"
      - "If the user says the answer is in code"
      - "trace the smallest concrete business flow"
      - "form an evidence-backed working conclusion"
      - "ask the user to correct, complete, or choose against it"
      - "decision-relevant uncertainty budget, not an exhaustive questionnaire"
      - "cross-check implementation evidence against existing user-confirmed answers"
      - "accept the point and stop asking"
      - "never ask the user to restate an implementation fact"
      - "ask only which normative meaning governs"
      - "Do not open with abstract prompts"
      - "working conclusion remains `proposed` / `current implementation fact`"
      - "## User-Confirmed Decision Mainline"
      - "canonical owner of Decision Delta capture and Plan Mainline Handoff"
      - "## Business-Semantics Gate"
      - "## Modeling Gap Intake Handoff"
      - "after `profile-business-model.md` finishes the user's agreed modeling scope"
      - "never create one PRD per gap"
      - "Show the full deduplicated gap set"
      - "### Plan-Complete Brainstorm Handoff"
      - "A written and internally checked Plan does not end the planning conversation"
      - "automatically enter a detailed user-facing brainstorm"
      - "Current conclusion"
      - "Evidence and constraints"
      - "Remaining question"
      - "Impact and trade-offs"
      - "Agent recommendation"
      - "three-line summary"
      - "exactly one topic"
      - "## Complex Plan"
      - "[workflow-state:planning]"
      - "it is not the runtime Native Plan"
      - "pass its chosen outcome, acceptance criteria, boundaries, and task breakdown"
      - "If new evidence overturns a load-bearing conclusion"
      - "Authority: user-confirmed"
      - "Evidence / Source: current conversation"
      - "desired business truth"
      - "current implementation fact"
      - "Plan Mainline Handoff"
      - "Before implementation handoff"
      - "for business-bearing work, distilled confirmed business meaning"
      - "legacy source, active destination, owner, activation path, and validation"
    must_not_contain:
      - "Pervasive reverse-question — default habit"
      - "one per lens"

  - file: workflows/plan-large.md
    must_contain:
      - "## Multi-Perspective Analysis"
      - "## Angle Contract"
      - "## Synthesis"
      - "## Parallel Analysis"

  - file: workflows/task-closure.md
    must_contain:
      - "## Task Closure Protocol"
      - "### Entry Gate"
      - "return to [`task-execution.md`](task-execution.md)"
      - "final Anchor Checkpoint"
      - "### Rationalizations to Reject"
      - "### Red Flags"
      - "## After-Action Review"
      - "Test count is not evidence quality"
      - "Replay the user-confirmed mainline"
      - "Closure owns final reconciliation"
      - "desired business truth"
      - "current implementation fact"
      - "first time a material drift is surfaced"
      - "task-execution.md#user-decision-drift-gate"
      - "for business-bearing decisions, also read the routed business rule"
      - "durable knowledge migrated/deleted/superseded"
      - "rather than creating a mandatory ledger"
      - "Ready for Delivery"
      - "is a checkpoint, not task completion"
      - "Closure never grants commit, push, MR, deploy, publish"
      - "leaves Closure open"
      - "without rerunning unrelated local checks"
      - "Closure Complete"

  - file: workflows/update-rules.md
    must_contain:
      - "## Business Leaf and Gotcha Ownership"
      - "A Gotcha is not a general implementation reference or a second business-model owner"
      - "Never copy the complete definition into both destinations"
      - "## Standalone Business-Model Input"
      - "Stable, clear, user-confirmed, cross-implementation business meaning is written directly into the unique routed leaf"
      - "Do not require a feature Plan"
      - "Confirmed implementation gap intake"
      - "create or reuse one draft gap dossier"
      - "## Active Bug-Fix Input"
      - "The only business-recording source during Fix Bug is the user's explicit business statement"
      - "Preserve the user's meaning faithfully"
      - "Do not derive a business rule from the Bug"
      - "Reusable engineering lessons discovered while fixing the Bug follow normal Closure/AAR"
      - "Fix Bug owns noticing and immediate invocation"
      - "### Recording Threshold"
      - "### Fidelity Gate"
      - "### Reconciliation Gate"
      - "### Activation Check"
      - "### Generalization Rule"
      - "## Plan Decision Source"
      - "plan-feature.md#user-confirmed-decision-mainline"
      - "owns distillation and reconciliation"
      - "Plan confirmed for implementation"
      - "bypasses only the Recording Threshold"
      - "Desired business truth and current implementation fact remain distinct"
      - "do not create a fixed ledger solely to satisfy the gate"

  - file: workflows/profile-business-model.md.example
    must_contain:
      - "Reconcile leaf / Gotcha ownership"
      - "Lift stable business truth that exists only in a Gotcha into the leaf"
      - "## User-Confirmed Input"
      - "plan-feature.md#question-gate"
      - "Implementation-Fact Question Gate"
      - "Close every decision-relevant trigger/entry"
      - "trace distinct flows independently"
      - "Cross-check that evidence with existing user-confirmed answers"
      - "accept the point and do not ask again"
      - "Never ask the user to choose an interface, branch, write target, protection rule, call order, or other current implementation fact"
      - "Standalone modeling writes stable, cross-implementation meaning directly into the routed leaf"
      - "does not create a PRD"
      - "## Confirmed Implementation Gap Collection and Handoff"
      - "never create one PRD per gap"
      - "Continue the user's agreed modeling scope"
      - "show the deduplicated gap set"
      - "The default unit is one business domain, not one code module"
      - "about 120 nonblank lines"
      - "more than 10 substantive H2 sections"
      - "Size only triggers review; it never decides the split"
      - "independently understandable business submodules"
      - "Do not split by document aspect"
      - "The index must select a leaf from task signals and carry no business body"
      - "rather than define an abstract concept from scratch"
      - "Authority: user-confirmed"
      - "desired business truth"
      - "current implementation fact"
      - "Persist by task type"
      - "immediate responsibility to pause the affected path"
      - "task-execution.md#user-decision-drift-gate"
      - "Do not ask code and the confirmed model to compete for authority"
      - "--workspace-root <workspace-root>"
      - "plain `scripts/sync-routing.sh --check` is sufficient only when every owner is skill-local"

  - file: scripts/sync-routing.sh
    must_contain:
      - "domain_overlays"
      - "domain overlay must inherit the task workflow"
      - "owner_roots"
      - "owner_ref_pattern"
      - "--workspace-root"
      - "task route does not preload knowledge"
      - "workflow must select a workflows/*.md procedure"
      - "Keywords identify candidates only"
      - "cross-owner target verification remains open"
      - "code-root target verification remains open"
      - "code target missing"
    must_not_contain:
      - "allowed_apps"

  - file: scripts/audit-orphans.sh
    must_contain:
      - "-type f -name '*.md'"

  - file: scripts/route-reachability.sh
    must_contain:
      - "references/business"
      - "-type f -name '*.md'"

  - file: workflows/maintain-docs.md
    must_contain:
      - "## Semantic Ownership and Local Actionability"
      - "Business Leaf and Gotcha Ownership"
      - "business-truth owner inversion"
      - "smallest task-specific trigger, immediate action, and current-task acceptance responsibility"
      - "A complete repeated rule or workflow is exceptional"
      - "generation is justified when a target must be independently delivered or independently used"
      - "sentence quota, score, marker, or file-count target"
      - "## Step 2: Independent Load-Reason Audit"
      - "## Step 5: Semantic Before/After Reconciliation"

  - file: workflows/fix-bug.md
    must_contain:
      - "## Mandatory Pre-Step"
      - "Design-or-defect gate"
      - "Repair-depth gate"
      - "invariant-owning boundary"
      - "smallest semantically complete repair"
      - "full/incremental/read/write path"
      - "user-confirmed Decision Context"
      - "Purely technical Design-derived work replays the source Plan without requiring a business model"
      - "plan-feature.md#question-gate"
      - "Implementation-Fact Question Gate"
      - "close every decision-relevant trigger/entry"
      - "trace distinct flows independently"
      - "Never ask the user to choose a current implementation fact"
      - "If the user says the answer is in code"
      - "cross-check it against any existing user-confirmed answer"
      - "continue without another question"
      - "ask only a remaining normative ambiguity that could change repair classification or expected behavior"
      - "Never ask the user to choose a current implementation fact, request exhaustive detail, or define an abstract concept from scratch"
      - "update-rules.md#active-bug-fix-input"
      - "instead of waiting for Task Closure"
      - "the only source eligible for a `references/business/<module>.md` record is the user's explicit business statement"
      - "Bug symptoms, root cause, repaired behavior, code, tests, runtime evidence, and Agent summaries are not `desired business truth`"
      - "Reusable engineering lessons discovered while fixing the Bug follow normal Closure/AAR"
      - "No Bug-derived or Agent-derived content entered the business model"
      - "User Decision Drift Gate"
      - "task-execution.md#user-decision-drift-gate"
      - "Task Closure Protocol"
    must_not_contain:
      - "Pervasive reverse-question — default habit"
      - "directly `spawn_agent`"
      - "as candidate business knowledge"

  - file: protocol-blocks/ambiguous-request-gate.md
    must_contain:
      - "## Implementation-Fact Question Gate"
      - "close the smallest decision-relevant implementation path"
      - "never ask the user to choose them"
      - "Trace distinct flows independently"
      - "remaining normative ambiguity"

  - file: rules/change-discipline.md
    must_contain:
      - "## Semantic Boundary"
      - "Default to Product Development"
      - "project-rules.md"
      - "coding-standards.md"
      - "ownership/provenance"
      - "Dependency count is risk evidence"
      - "Use Operational Stabilization only"
      - "## Mutation Boundary"

  - file: workflows/task-execution.md
    must_contain:
      - "## Evidence and Knowledge Gate"
      - "smallest source/runtime slice"
      - "diagnostic evidence, never correctness gates"
      - "material Boundaries such as scope, non-goals"
      - "harness's native Plan"
      - "present only useful alignment"
      - "do not repeat its steps in chat"
      - "Before each main Plan step"
      - "cross-cutting modifier, never a first-workflow route"
