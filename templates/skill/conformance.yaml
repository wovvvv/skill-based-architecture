      - "## Main-Agent Boundary"
      - "## Interception Transparency"

  - file: workflows/subagent-driven.md
    must_contain:
      - "## Mode Selection"
      - "## Mode 2 Entry"
      - "## Harness Compatibility"
      - "Worker-local status never advances the Native Plan"
    must_not_contain:
      - "Iron Law (violation = task failure"
      - "must directly call `spawn_agent`"

  - file: workflows/subagent-orchestration.md
    must_contain:
      - "## 1. Contract"
      - "## 3. Main-Agent Review"
      - "Task Ref"
      - "Context Read"
      - "provenance index, not proof"
      - "does **not** run project-wide Task Closure"

  - file: protocol-blocks/subagent-contract.md
    must_contain:
      - "## Task Ref"
      - "## Role"
      - "## Evidence"
      - "Context Read"
      - "Files Changed"
      - "Checks Run"
      - "Remaining Risks"
      - "provenance index, not proof"

  - file: workflows/receiving-review.md
    must_contain:
      - "## Process"
      - "Verify every claim"
      - "user-confirmed Decision Context"
      - "Purely technical Design-derived work replays the source Plan without requiring a business model"
      - "pause the affected path and ask the user immediately"
      - "task-execution.md#user-decision-drift-gate"

  - file: workflows/update-upstream.md
    must_contain:
