      - "harness's native Plan/Task surface"
      - "do not repeat its steps in chat"
      - "## Presentation Gate"
      - "Evaluate **Structured Brief first**"
      - "Compact Alignment is allowed only when all Structured conditions are false"
      - "first user-facing task-start message MUST begin"
      - "Steps must be numbered"
      - "do not collapse the brief into prose or render empty headings"
      - "Before each main Plan step"
      - "Never silently overwrite a load-bearing conclusion"
      - "business owner's confirmation"
      - "every governing Plan path"
      - "only business-bearing decisions require a routed business rule"
      - "## User Decision Drift Gate"
      - "product meaning, business rule, scope, flow, state, boundary, invariant, acceptance condition, or user-visible behavior"
      - "Ordinary implementation choices that preserve those decisions do not trigger this gate"
      - "pause the affected path immediately"
      - "user-decision-drift.md"
      - "including updating the Task Anchor and remaining Native Plan before more mutation"
      - "bind each material risk to the fitted evidence and its stop/escalation condition"
      - "the evidence that could resolve or falsify it"
      - "receiving a successful exit code"
      - "If it contradicts the premise"
      - "if it is inconclusive"
      - "do not narrate it before every tool call"
      - "does not create durable planning files or recover task state across Sessions"
      - "## Verified Failure Handoff"
      - "Session-only failure candidate"
      - "Retries inside the same unresolved task remain one occurrence"
      - "rule-update/verified-failure.md#verified-failure-input"
      - "Verified Failure owns durable reconciliation"
      - "every verified failure has a Rule Update learning outcome"
    must_not_contain:
      - "task_plan.md"
      - "cross-tool state sync"
      - "Plan: <concise task-specific steps"

